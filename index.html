// Hook kustom untuk efek suara menggunakan native Web Audio API
const useSound = (enabled) => {
    const audioCtx = useRef(null);

    const init = () => {
        if (!audioCtx.current) {
            audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.current.state === 'suspended') {
            audioCtx.current.resume();
        }
    };

    const playTone = (freq, type, duration, vol, startTimeOffset) => {
        if (!enabled) return;
        try {
            init();
            const ctx = audioCtx.current;
            const startTime = ctx.currentTime + startTimeOffset;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);
            
            gain.gain.setValueAtTime(vol, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start(startTime);
            osc.stop(startTime + duration);
        } catch(e) {
            console.error("Audio error:", e);
        }
    };

    const playClick = () => playTone(523.25, 'sine', 0.1, 0.1, 0); // Nada C5 pendek
    
    const playCorrect = () => {
        playTone(523.25, 'sine', 0.1, 0.1, 0);
        playTone(659.25, 'sine', 0.1, 0.1, 0.1);
        playTone(783.99, 'sine', 0.2, 0.1, 0.2);
        playTone(1046.50, 'sine', 0.3, 0.1, 0.3); // Nada kemenangan
    };
    
    const playWrong = () => {
        playTone(349.23, 'triangle', 0.2, 0.1, 0); // F4
        playTone(261.63, 'triangle', 0.3, 0.1, 0.2); // C4 turun
    };

    return { playClick, playCorrect, playWrong, init };
};

function GameScreen({ onNavigate, sound }) {
    const [score, setScore] = useState(0);
    const [message, setMessage] = useState("");
    const [items, setItems] = useState(() => {
        const initialItems = [
            { id: 1, icon: '🍎', isHealthy: true, name: 'Apel' },
            { id: 2, icon: '🍬', isHealthy: false, name: 'Permen' },
            { id: 3, icon: '🧼', isHealthy: true, name: 'Sabun' },
            { id: 4, icon: '🦠', isHealthy: false, name: 'Kuman' },
            { id: 5, icon: '🪥', isHealthy: true, name: 'Sikat Gigi' },
            { id: 6, icon: '🥤', isHealthy: false, name: 'Minuman Manis' },
            { id: 7, icon: '🥗', isHealthy: true, name: 'Sayur' },
            { id: 8, icon: '🏃', isHealthy: true, name: 'Olahraga' }
        ];
        return initialItems.sort(() => Math.random() - 0.5).map(i => ({...i, clicked: false}));
    });

    const maxScore = items.filter(i => i.isHealthy).length; // 5 items

    const handleClick = (item) => {
        if (item.clicked) return;
        
        const newItems = items.map(i => i.id === item.id ? { ...i, clicked: true } : i);
        setItems(newItems);

        if (item.isHealthy) {
            sound.playCorrect();
            setScore(s => s + 1);
            setMessage(`Hebat! ${item.name} itu bagus! 🌟`);
        } else {
            sound.playWrong();
            setMessage(`Oops! ${item.name} kurang baik. ❌`);
        }
    };

    const isFinished = score === maxScore;

    return (
        <div className="p-6 md:p-10 min-h-[600px] flex flex-col justify-between pop-in">
            <div className="max-w-3xl mx-auto w-full">
                <div className="text-center mb-6">
                    <h2 className="text-2xl md:text-4xl font-black text-orange-600 mb-3 flex items-center justify-center gap-3">
                        🎮 GAME PILAH PILIH
                    </h2>
                    <p className="text-sm md:text-xl font-bold text-gray-700 bg-orange-100 inline-block px-4 md:px-6 py-2 md:py-3 rounded-full border-4 border-orange-300 shadow-sm">
                        Klik benda atau kegiatan yang <span className="text-green-600 font-black">SEHAT & BERSIH</span>!
                    </p>
                </div>

                <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-3xl shadow-md border-4 border-gray-100 mb-8 gap-4">
                    <div className="bg-orange-100 px-6 py-2 rounded-2xl border-2 border-orange-200">
                        <span className="text-lg md:text-2xl font-bold text-gray-700">Skor: <span className="text-orange-600 font-black">{score} / {maxScore}</span></span>
                    </div>
                    <div className="h-10 flex items-center justify-center px-4 min-w-[200px] md:min-w-[250px]">
                        <span className="text-base md:text-xl font-black text-blue-600 text-center">{message}</span>
                    </div>
                </div>

                {isFinished ? (
                    <div className="bg-green-100 border-4 border-green-400 p-8 md:p-12 rounded-[40px] text-center shadow-inner pop-in">
                        <span className="text-6xl md:text-7xl mb-4 block float-anim">🏆</span>
                        <h3 className="text-2xl md:text-4xl font-black text-green-700 mb-4">LUAR BIASA!</h3>
                        <p className="text-lg md:text-xl font-bold text-gray-700 bg-white inline-block px-6 py-2 rounded-xl border-2 border-green-200">
                            Kamu sudah tahu mana yang sehat dan bersih!
                        </p>
                    </div>
                ) : (
                    <div className="grid grid-cols-4 gap-3 md:gap-6">
                        {items.map(item => (
                            <button 
                                key={item.id}
                                onClick={() => handleClick(item)}
                                disabled={item.clicked}
                                className={`aspect-square sm:h-24 md:h-32 text-4xl sm:text-5xl md:text-6xl rounded-2xl md:rounded-3xl flex items-center justify-center transition-all duration-300 shadow-md border-b-8 
                                    ${item.clicked 
                                        ? (item.isHealthy ? 'bg-green-100 border-green-300 opacity-60 scale-95' : 'bg-red-100 border-red-300 opacity-60 grayscale scale-95') 
                                        : 'bg-white border-gray-200 hover:bg-gray-50 hover:-translate-y-2 active:translate-y-0 active:border-b-4'}`}
                            >
                                {item.icon}
                            </button>
                        ))}
                    </div>
                )}
            </div>

            <BottomNav 
                onHome={() => onNavigate('main')} 
                onBack={() => onNavigate('main')}
                showNext={false}
                onFinish={isFinished ? () => onNavigate('main') : null}
                sound={sound}
            />
        </div>
    );
}

function EvaluasiScreen({ onNavigate, sound }) {
    const [currentQ, setCurrentQ] = useState(0);
    const [score, setScore] = useState(0);
    const [finished, setFinished] = useState(false);
    const [feedback, setFeedback] = useState(null);

    const questions = [
        {
            q: "Tubuh kita adalah amanah dari Allah Swt, maka kita harus...",
            options: ["Membiarkannya kotor", "Menjaganya tetap bersih & sehat", "Bermain lumpur tiap hari"],
            answer: 1
        },
        {
            q: "Manakah di bawah ini yang merupakan contoh akhlak kepada diri sendiri?",
            options: ["Makan makanan sehat & bergizi", "Tidur larut malam", "Membuang sampah sembarangan"],
            answer: 0
        },
        {
            q: "Menurut ajaran Islam, menjaga kebersihan adalah sebagian dari...",
            options: ["Kekayaan", "Hobi", "Iman"],
            answer: 2
        },
        {
            q: "Menggosok gigi secara rutin sebaiknya dilakukan...",
            options: ["Sesudah makan dan sebelum tidur", "Hanya saat mau berpergian", "Satu kali saja dalam seminggu"],
            answer: 0
        },
        {
            q: "Rajin berolahraga dan beristirahat yang cukup adalah contoh dari...",
            options: ["Pola hidup malas", "Pola hidup sehat", "Pola hidup kotor"],
            answer: 1
        },
        {
            q: "Jika melihat sampah berserakan di rumah, sikap anak muslim yang baik adalah...",
            options: ["Membiarkannya saja", "Menunggu ibu membersihkan", "Segera membersihkan & membuangnya"],
            answer: 2
        },
        {
            q: "Menjaga kesehatan tubuh termasuk wujud rasa ... kita kepada Allah Swt.",
            options: ["Marah", "Syukur", "Sedih"],
            answer: 1
        }
    ];

    const handleAnswer = (idx) => {
        if (feedback !== null) return; // Prevent double click
        const correct = idx === questions[currentQ].answer;
        
        if (correct) {
            sound.playCorrect();
            setScore(s => s + (100 / questions.length));
            setFeedback('correct');
        } else {
            sound.playWrong();
            setFeedback('wrong');
        }

        setTimeout(() => {
            setFeedback(null);
            if (currentQ < questions.length - 1) {
                setCurrentQ(currentQ + 1);
            } else {
                setFinished(true);
                if (correct) sound.playClick();
            }
        }, 1500);
    };

    return (
        <div className="p-6 md:p-10 min-h-[600px] flex flex-col justify-between pop-in">
            <div className="max-w-3xl mx-auto w-full">
                <div className="text-center mb-8">
                    <h2 className="text-2xl md:text-4xl font-black text-indigo-700 flex items-center justify-center gap-3">
                        <span className="bg-indigo-100 p-2 rounded-2xl flex-shrink-0">📝</span> EVALUASI
                    </h2>
                </div>

                {!finished ? (
                    <div className="bg-white p-6 md:p-10 rounded-[30px] md:rounded-[40px] shadow-lg border-4 border-indigo-100 relative mt-6">
                        <div className="absolute -top-5 md:-top-6 left-1/2 transform -translate-x-1/2 bg-indigo-500 text-white font-black py-1 px-4 md:py-2 md:px-6 rounded-full border-4 border-white shadow-md text-sm md:text-lg whitespace-nowrap">
                            Soal {currentQ + 1} / {questions.length}
                        </div>
                        
                        <h3 className="text-lg md:text-2xl font-black text-gray-800 mb-6 md:mb-8 mt-4 text-center leading-relaxed">
                            {questions[currentQ].q}
                        </h3>
                        
                        <div className="space-y-3 md:space-y-4">
                            {questions[currentQ].options.map((opt, i) => (
                                <button 
                                    key={i}
                                    onClick={() => handleAnswer(i)}
                                    className={`w-full text-left p-3 md:p-5 rounded-2xl font-bold text-base md:text-xl border-4 transition-all shadow-sm flex items-center gap-3 md:gap-4 hover:-translate-y-1
                                        ${feedback === null ? 'bg-indigo-50 border-indigo-200 hover:bg-indigo-100 hover:border-indigo-300 text-gray-700' : 
                                          feedback === 'correct' && i === questions[currentQ].answer ? 'bg-green-400 border-green-500 text-white translate-y-0' :
                                          feedback === 'wrong' && i === questions[currentQ].answer ? 'bg-green-100 border-green-300 text-gray-600 translate-y-0' :
                                          feedback === 'wrong' && i !== questions[currentQ].answer ? 'bg-red-400 border-red-500 text-white translate-y-0' : 'bg-gray-100 border-gray-200 text-gray-400 translate-y-0'}
                                    `}
                                >
                                    <div className="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white flex justify-center items-center text-indigo-600 font-black shadow-inner flex-shrink-0 text-sm md:text-base">
                                        {['A', 'B', 'C'][i]}
                                    </div>
                                    {opt}
                                </button>
                            ))}
                        </div>
                        
                        <div className="h-10 md:h-12 mt-6 flex items-center justify-center">
                            {feedback === 'correct' && <div className="text-green-600 font-black text-lg md:text-2xl pop-in bg-green-100 px-6 py-2 rounded-full border-2 border-green-200">Benar! Hebat! 🎉</div>}
                            {feedback === 'wrong' && <div className="text-red-600 font-black text-lg md:text-2xl pop-in bg-red-100 px-6 py-2 rounded-full border-2 border-red-200">Kurang tepat. Semangat! 💪</div>}
                        </div>
                    </div>
                ) : (
                    <div className="bg-white p-8 md:p-12 rounded-[30px] md:rounded-[40px] shadow-lg border-4 border-indigo-100 text-center pop-in mt-6 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-50 to-white opacity-50"></div>
                        <span className="text-7xl md:text-8xl block mb-6 relative z-10 float-anim">{Math.round(score) > 70 ? '🌟' : '📚'}</span>
                        <h3 className="text-2xl md:text-4xl font-black text-gray-800 mb-4 relative z-10">EVALUASI SELESAI</h3>
                        <p className="text-lg md:text-2xl font-bold text-gray-600 mb-6 relative z-10">Nilai Kamu:</p>
                        
                        <div className="text-6xl md:text-7xl font-black text-indigo-600 mb-8 bg-indigo-50 inline-block px-10 py-4 md:px-12 md:py-6 rounded-[30px] md:rounded-[40px] border-4 md:border-8 border-indigo-200 shadow-inner relative z-10">
                            {Math.round(score)}
                        </div>
                        
                        <p className="text-base md:text-xl font-bold text-gray-700 relative z-10 bg-indigo-50/80 p-4 rounded-2xl border-2 border-indigo-100">
                            {Math.round(score) === 100 
                                ? "Alhamdulillah! Sempurna! Kamu anak yang pintar dan bersih." 
                                : "Terus belajar dan biasakan hidup bersih & sehat ya!"}
                        </p>
                    </div>
                )}
            </div>

            <BottomNav 
                onHome={() => onNavigate('main')} 
                onBack={() => onNavigate('main')}
                showNext={false}
                onFinish={finished ? () => onNavigate('main') : null}
                sound={sound}
            />
        </div>
    );
}

// Layar Memuat (Loading)
function LoadingScreen() {
    const [progress, setProgress] = useState(0);

    useEffect(() => {
        // Simulasi progres loading yang berjalan
        const timer = setInterval(() => {
            setProgress(p => {
                // Menambah kemajuan secara acak untuk efek realistis
                const next = p + Math.floor(Math.random() * 20) + 10;
                return next > 100 ? 100 : next;
            });
        }, 300);
        return () => clearInterval(timer);
    }, []);

    return (
        <div className="flex flex-col items-center justify-center p-6 md:p-10 text-center min-h-[600px] pop-in">
            <div className="flex gap-4 md:gap-6 mb-8 text-6xl md:text-8xl">
                <span className="animate-bounce" style={{animationDelay: '0s'}}>🌿</span>
                <span className="animate-bounce" style={{animationDelay: '0.2s'}}>📚</span>
                <span className="animate-bounce" style={{animationDelay: '0.4s'}}>✨</span>
            </div>
            
            <h2 className="text-3xl md:text-4xl font-black text-teal-700 mb-4 drop-shadow-sm pop-in">
                Tunggu Sebentar Ya!
            </h2>
            <p className="text-lg md:text-xl font-bold text-teal-600 mb-10 bg-teal-50 px-6 py-2 rounded-full border-2 border-teal-100 shadow-sm">
                Sedang menyiapkan keseruan belajarmu... 👦🏻👧🏻
            </p>

            <div className="w-64 md:w-80 h-8 bg-gray-100 rounded-full border-4 border-teal-200 overflow-hidden shadow-inner relative">
                <div 
                    className="h-full bg-gradient-to-r from-teal-400 to-emerald-500 transition-all duration-300 ease-out flex items-center justify-end pr-3"
                    style={{ width: `${progress}%` }}
                >
                    <span className="text-xs md:text-sm text-white font-black drop-shadow-md">{progress}%</span>
                </div>
            </div>
        </div>
    );
}

// Komponen Utama Aplikasi
export default function App() {
    const [isLoading, setIsLoading] = useState(true);
    const [screen, setScreen] = useState('opening');
    const [soundEnabled, setSoundEnabled] = useState(true);
    
    // Inisialisasi custom hook untuk sound
    const sound = useSound(soundEnabled);

    // Mengatur waktu untuk halaman loading menghilang otomatis
    useEffect(() => {
        const timer = setTimeout(() => {
            setIsLoading(false);
        }, 2500); // Loading akan tampil selama 2,5 detik
        
        return () => clearTimeout(timer);
    }, []);

    const goTo = (newScreen) => {
        setScreen(newScreen);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    const toggleSound = () => {
        setSoundEnabled(!soundEnabled);
    };

    const startApp = () => {
        setScreen('main');
    };

    // Router Sederhana
    let currentView = null;
    
    if (isLoading) {
        currentView = <LoadingScreen />;
    } else {
        switch(screen) {
            case 'opening': currentView = <OpeningScreen onStart={startApp} sound={sound} />; break;
            case 'main': currentView = <MainMenuScreen onNavigate={goTo} soundEnabled={soundEnabled} toggleSound={toggleSound} sound={sound} />; break;
            case 'tujuan': currentView = <TujuanScreen onNavigate={goTo} sound={sound} />; break;
            case 'materi': currentView = <MateriScreen onNavigate={goTo} sound={sound} />; break;
            case 'game': currentView = <GameScreen onNavigate={goTo} sound={sound} />; break;
            case 'evaluasi': currentView = <EvaluasiScreen onNavigate={goTo} sound={sound} />; break;
            default: currentView = <OpeningScreen onStart={startApp} sound={sound} />;
        }
    }

    return (
        <>
            <CustomStyles />
            
            {/* Dekorasi Latar Belakang Alam 3D */}
            <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 flex flex-col justify-between">
                {/* Awan dan Bintang */}

                    <div className="absolute top-5 right-20 text-5xl md:text-7xl opacity-80 float-anim" style={{animationDelay: '1s'}}>☁️</div>
                    <div className="absolute top-32 left-1/4 text-4xl md:text-6xl opacity-70 float-anim" style={{animationDelay: '2s'}}>☁️</div>
                    <div className="absolute top-16 left-1/3 text-3xl md:text-5xl text-yellow-300 animate-pulse">⭐</div>
                    <div className="absolute top-28 right-1/4 text-2xl md:text-4xl text-yellow-300 animate-bounce">⭐</div>
                </div>
                {/* Pohon dan Semak di Garis Cakrawala */}
                <div className="w-full absolute top-[45%] md:top-[48%] flex justify-between px-4 md:px-10 z-0">
                    <div className="text-8xl md:text-9xl -ml-10 md:ml-0 filter drop-shadow-lg">🌳</div>
                    <div className="text-6xl md:text-8xl mt-10 filter drop-shadow-lg hidden md:block">🌲</div>
                    <div className="text-6xl md:text-8xl mt-8 filter drop-shadow-lg hidden md:block">🌲</div>
                    <div className="text-8xl md:text-9xl -mr-10 md:mr-0 filter drop-shadow-lg">🌳</div>
                </div>
            </div>

            {/* Container Aplikasi */}
            <div className="w-full min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 md:p-8 relative z-10 mt-10 md:mt-0">
                <div className="w-full max-w-5xl glass-panel rounded-[40px] md:rounded-[50px] shadow-2xl overflow-hidden relative">
                    {currentView}
                </div>

                {}
                <div className="mt-4 text-white font-bold text-xs md:text-sm drop-shadow-md tracking-wide bg-black/10 px-4 py-2 rounded-full backdrop-blur-sm border border-white/20 text-center relative z-10">
